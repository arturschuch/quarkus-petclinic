quarkus.application.name=quarkus-petclinic
mp.openapi.extensions.smallrye.info.title=Quarkus PetClinic API
mp.openapi.extensions.smallrye.info.version=1.0.0-SNAPSHOT
mp.openapi.extensions.smallrye.info.description=PetClinic domain redesigned with Quarkus REST, CDI, Hibernate ORM with Panache, and Dev Services.

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.db-name=petclinic
quarkus.datasource.devservices.image-name=postgres:16

quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

quarkus.jackson.serialization-inclusion=non-null

%dev.quarkus.hibernate-orm.log.sql=true
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%prod.quarkus.hibernate-orm.sql-load-script=no-file
